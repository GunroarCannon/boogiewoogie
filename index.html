<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdfbf7" />
    <meta name="description" content="Boogiewoogie - simple todo app. Collaborative lined paper todo list with spring physics, voice-to-AI, and private readable keys." />
    <link rel="manifest" href="/manifest.json" />
    <title>Boogiewoogie - simple todo app</title>
    <script>
      // Self-healing recovery if a stale service worker served old HTML pointing to obsolete bundles (404)
      window.addEventListener('error', function(e) {
        var target = e.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK') && (target.src || target.href)) {
          var assetUrl = target.src || target.href;
          if (assetUrl.indexOf('/assets/') !== -1) {
            var retryKey = 'sw_reload_' + assetUrl;
            if (!sessionStorage.getItem(retryKey)) {
              sessionStorage.setItem(retryKey, '1');
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  return Promise.all(regs.map(function(r) { return r.unregister(); }));
                }).then(function() {
                  if ('caches' in window) {
                    return caches.keys().then(function(keys) {
                      return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                    });
                  }
                }).finally(function() {
                  window.location.reload();
                });
              } else {
                window.location.reload();
              }
            }
          }
        }
      }, true);
      window.addEventListener('vite:preloadError', function() {
        window.location.reload();
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
